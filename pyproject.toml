# Tooling only: no [project] or [build-system] here. The distributions live in
# packages/core and packages/cli (spec §16.4).

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "pre-commit",
    "hatchling",
]

[tool.ruff]
target-version = "py312"
src = [".", "packages/core/src", "packages/cli/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["packages/core/src", "packages/cli/src"]

[tool.coverage.run]
source = ["packages/core/src", "packages/cli/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running perf smoke tests (still run in CI)"]
