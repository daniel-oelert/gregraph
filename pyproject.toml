[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gregraph"
version = "0.1.0"
description = "Local, Git-aware requirements management CLI"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "jinja2>=3",
    "markdown-it-py>=3",
    "mdit-py-plugins",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "pre-commit",
]

[project.scripts]
gregraph = "gregraph.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["gregraph"]

[tool.ruff]
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running perf smoke tests (still run in CI)"]
