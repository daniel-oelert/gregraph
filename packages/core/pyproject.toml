[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gregraph-core"
version = "0.1.1"
description = "Local, Git-aware requirements management core library"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "jinja2>=3",
    "markdown-it-py>=3",
    "mdit-py-plugins",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gregraph"]
